[pytest]
# Allow `pytest` from backend/ (where the venv lives).
testpaths = ../tests
pythonpath = .
addopts =
    --strict-markers
    --tb=short
    --cov=.
    --cov-config=.coveragerc
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-fail-under=70

filterwarnings =
    ignore::DeprecationWarning
