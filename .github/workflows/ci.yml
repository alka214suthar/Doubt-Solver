name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy --follow-imports=skip security.py errors.py config.py normalization.py image_uploads.py rate_limit.py

      - name: Tests with coverage
        working-directory: .
        env:
          APP_ENV: test
          JWT_SECRET: ci-test-secret-key
          GEMINI_API_KEY: test-key
          DATABASE_URL: sqlite://
        run: |
          pip install -r backend/requirements.txt
          pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t doubt-solver-frontend .

      - name: Build backend image
        run: docker build -t doubt-solver-backend ./backend
